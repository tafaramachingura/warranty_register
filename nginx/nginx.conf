events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---------------------
    # Upstream (Docker)
    # ---------------------
    upstream django {
        server web:8000;
    }

    # =====================================================
    # HTTP → HTTPS (REDIRECT ONLY)
    # =====================================================
    server {
        listen 80;
        server_name vm2.eport.ws;

        return 301 https://$host$request_uri;
    }

    # =====================================================
    # HTTPS (MAIN SERVER)
    # =====================================================
    server {
        listen 443 ssl http2;
        server_name vm2.eport.ws;

        # ---------------------
        # SSL
        # ---------------------
        ssl_certificate     /etc/letsencrypt/live/vm2.eport.ws/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vm2.eport.ws/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ---------------------
        # Django app (/register)
        # ---------------------
        location /register/ {
            proxy_pass http://warranty_register:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Script-Name /register;

            proxy_redirect off;
        }

        # ---------------------
        # Security headers (optional but recommended)
        # ---------------------
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }
}
