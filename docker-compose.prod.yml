version: '3.8'

services:
  web:
    build: .
    container_name: warranty_register
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn warranty_core.wsgi:application --bind 0.0.0.0:8000 --workers=3
      "
    volumes:
      - static_volume:/app/staticfiles
      - ./:/app
    env_file:
      - .env.pro
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: warranty_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  static_volume:
