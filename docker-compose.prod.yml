version: "3.8"

services:
  web:
    env_file:
      - .env.pro

  nginx:
    image: nginx:alpine
    container_name: warranty_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app_network
