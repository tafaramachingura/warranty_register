version: "3.9"

services:
  web:
    build: .
    container_name: warranty_register
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
    command: >
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-postgres}\" ; do
      echo 'waiting for db'; sleep 1; done && 
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:13
    container_name: warranty_register_db
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warranty_register_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-warranty_register_db}\" -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # nginx:
  #   image: nginx:alpine
  #   container_name: warranty_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - web
  #   restart: unless-stopped
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: {}
  static_volume: {}
