version: "3.8"

services:
  web:
    build: .
    container_name: warranty_register
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  static_volume:
